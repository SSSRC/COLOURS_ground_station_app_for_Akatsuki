<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>COLOURS Ground Station</title>

<meta
http-equiv="Content-Security-Policy"
content="
default-src 'self';
script-src 'self' https://cdn.jsdelivr.net;
style-src 'self' 'unsafe-inline';
"
/>

<style>

body{
font-family: "Times New Roman";
margin:20px;
background:#111;
color:#eee;
}

h1{
color:#4fc3f7;
}

h2{
margin-top:30px;
border-bottom:1px solid #444;
padding-bottom:5px;
}

select,input,button{
padding:6px;
margin-right:8px;
font-size:14px;
}

button{
cursor:pointer;
}

#status{
margin-top:10px;
font-weight:bold;
color:#4caf50;
}

.telemetry-value{
font-size:22px;
margin:6px 0;
}

canvas{
display:block;
width:100%;
height:260px;
margin:10px 0 30px 0;
background:#fff;
border-radius:6px;
}

.raw{
font-size:13px;
color:#aaa;
}

</style>
</head>

<body>

<h1>COLOURS Ground Station 🚀</h1>

<div>

<h2>Serial</h2>

<select id="port"></select>
<input id="baud" value="115200"/>

<button id="connect">接続</button>
<button id="disconnect">切断</button>

<div id="status">未接続</div>

</div>

<div>

<h2>Telemetry</h2>

<div class="telemetry-value">
Pressure: <span id="pressure">---</span> Pa
</div>

<div class="telemetry-value">
Temp: <span id="temp">---</span> °C
</div>

<div class="telemetry-value">
Alt: <span id="alt">---</span> m
</div>

<div class="raw">
Raw: <span id="raw">---</span>
</div>

</div>

<div>

<h2>Altitude Graph</h2>

<canvas id="chartAlt"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="./dist/renderer.js"></script>

</body>
</html>
