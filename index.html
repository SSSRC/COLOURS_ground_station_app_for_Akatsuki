<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>COLOURS Ground Station</title>

<meta
http-equiv="Content-Security-Policy"
content="
default-src 'self';
script-src 'self' https://cdn.jsdelivr.net;
style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
img-src 'self' data: https://tile.openstreetmap.org https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org;
"
/>

<style>
body{
  font-family:"Times New Roman";
  margin:20px;
  background:#111;
  color:#eee;
}

h1{
  color:#4fc3f7;
}

h2{
  margin-top:30px;
  border-bottom:1px solid #444;
  padding-bottom:5px;
}

select,input,button{
  padding:6px;
  margin-right:8px;
  font-size:14px;
}

button{
  cursor:pointer;
}

#status{
  margin-top:10px;
  font-weight:bold;
  color:#4caf50;
}

.telemetry-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap:8px 20px;
  margin-top:10px;
}

.telemetry-value{
  font-size:22px;
  margin:6px 0;
}

.raw{
  font-size:13px;
  color:#aaa;
  margin-top:10px;
  word-break:break-all;
}

#map{
  display:block;
  width:100%;
  height:420px;
  margin:10px 0 30px 0;
  background:#fff;
  border-radius:6px;
}

canvas{
  display:block;
  width:100%;
  height:260px;
  margin:10px 0 30px 0;
  background:#fff;
  border-radius:6px;
}
</style>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
/>
</head>

<body>

<h1>COLOURS Ground Station 🚀</h1>

<div>
  <h2>Serial</h2>

  <select id="port"></select>
  <input id="baud" value="115200"/>

  <button id="connect">接続</button>
  <button id="disconnect">切断</button>

  <div id="status">未接続</div>
</div>

<div>
  <h2>Telemetry</h2>

  <div class="telemetry-grid">
    <div class="telemetry-value">Latitude: <span id="lat">---</span></div>
    <div class="telemetry-value">Longitude: <span id="lon">---</span></div>
    <div class="telemetry-value">Time: <span id="gpstime">---</span></div>
    <div class="telemetry-value">Fix: <span id="fix">---</span></div>

    <div class="telemetry-value">Pressure: <span id="pressure">---</span> Pa</div>
    <div class="telemetry-value">Temp: <span id="temp">---</span> °C</div>
    <div class="telemetry-value">Alt: <span id="alt">---</span> m</div>
  </div>

  <div class="raw">
    Raw: <span id="raw">---</span>
  </div>
</div>

<div>
  <h2>GNSS Map</h2>
  <div id="map"></div>
</div>

<div>
  <h2>Altitude Graph</h2>
  <canvas id="chartAlt"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./dist/renderer.js"></script>

</body>
</html>
